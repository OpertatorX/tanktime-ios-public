name: TankTime
options:
  bundleIdPrefix: com.operatorx
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.11.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: 3.1.0
targets:
  TankTime:
    type: application
    platform: iOS
    sources:
      - path: TankTime
    dependencies:
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.operatorx.tanktime
        INFOPLIST_FILE: TankTime/Info.plist
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        OTHER_LDFLAGS: "$(inherited) -ObjC"
      configs:
        Debug:
          ADMOB_APP_ID: ca-app-pub-3940256099942544~1458002511
          ADMOB_BANNER_ID: ca-app-pub-3940256099942544/2934735716
          ADMOB_INTERSTITIAL_ID: ca-app-pub-3940256099942544/4411468910
        Release:
          ADMOB_APP_ID: "$(TANKTIME_ADMOB_APP_ID)"
          ADMOB_BANNER_ID: "$(TANKTIME_ADMOB_BANNER_ID)"
          ADMOB_INTERSTITIAL_ID: "$(TANKTIME_ADMOB_INTERSTITIAL_ID)"
    scheme:
      testTargets:
        - TankTimeTests
  TankTimeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TankTimeTests
    dependencies:
      - target: TankTime
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

