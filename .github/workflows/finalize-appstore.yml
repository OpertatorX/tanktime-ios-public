name: Finalize App Store

on:
  workflow_dispatch:
    inputs:
      submit_for_review:
        description: 'Submit the selected build to App Review after attachment'
        required: true
        default: false
        type: boolean

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
      ASC_APP_ID: '6818814141'
      ASC_VERSION: '1.0'
      SUBMIT_FOR_REVIEW: ${{ inputs.submit_for_review && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Require App Store Connect credentials
        run: |
          set -euo pipefail
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_API_KEY_BASE64"
      - name: Install API client dependencies
        run: python3 -m pip install --quiet requests pyjwt cryptography
      - name: Select processed build and finalize
        run: python3 scripts/select_build_and_submit.py
      - name: Cleanup ephemeral signing assets
        if: success()
        run: python3 scripts/apple_ephemeral_signing.py cleanup
