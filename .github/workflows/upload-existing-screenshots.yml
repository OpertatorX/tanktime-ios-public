name: Upload Existing App Store Screenshots

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
      ASC_APP_ID: '6818814141'
      ASC_VERSION: '1.0'
    steps:
      - uses: actions/checkout@v4
      - name: Require App Store Connect credentials
        run: |
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_API_KEY_BASE64"
      - name: Download verified screenshot artifact
        run: gh run download 37188258319 --repo OpertatorX/tanktime-ios-public --name tanktime-app-store-screenshots --dir .
      - name: Validate screenshot package
        run: |
          test "$(find screenshots-promo -name '*.png' | wc -l | tr -d ' ')" -eq 20
          find screenshots-promo -name '*.png' | sort
      - name: Upload screenshots to App Store Connect
        run: |
          python3 -m pip install --quiet requests pyjwt cryptography
          python3 scripts/upload_appstore_screenshots.py
