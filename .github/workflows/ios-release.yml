name: iOS Release

on:
  workflow_dispatch:

jobs:
  archive-and-upload:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      BUNDLE_ID: com.operatorx.tanktime
      TEAM_ID: 67ZL6VYTQ8
      TANKTIME_ADMOB_APP_ID: ${{ secrets.TANKTIME_ADMOB_APP_ID }}
      TANKTIME_ADMOB_BANNER_ID: ${{ secrets.TANKTIME_ADMOB_BANNER_ID }}
      TANKTIME_ADMOB_INTERSTITIAL_ID: ${{ secrets.TANKTIME_ADMOB_INTERSTITIAL_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install xcodegen imagemagick
      - name: Materialize original TankTime icon
        run: bash scripts/materialize_app_icon.sh
      - name: Generate project
        run: xcodegen generate
      - name: Preflight release gates
        run: bash scripts/preflight_ads_release.sh
      - name: Install signing credentials
        env:
          P12_BASE64: ${{ secrets.APPLE_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DIST_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$P12_BASE64" && test -n "$PROFILE_BASE64"
          KEYCHAIN="$RUNNER_TEMP/tanktime.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/distribution.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/TankTime.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/TankTime.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/TankTime.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
      - name: Archive
        run: |
          set -euo pipefail
          mkdir -p artifacts
          xcodebuild \
            -project TankTime.xcodeproj \
            -scheme TankTime \
            -configuration Release \
            -archivePath "$PWD/artifacts/TankTime.xcarchive" \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            TANKTIME_ADMOB_APP_ID="$TANKTIME_ADMOB_APP_ID" \
            TANKTIME_ADMOB_BANNER_ID="$TANKTIME_ADMOB_BANNER_ID" \
            TANKTIME_ADMOB_INTERSTITIAL_ID="$TANKTIME_ADMOB_INTERSTITIAL_ID" \
            archive
      - name: Audit production archive
        run: |
          set -euo pipefail
          APP="$PWD/artifacts/TankTime.xcarchive/Products/Applications/TankTime.app"
          test -d "$APP"
          plutil -p "$APP/Info.plist" | tee "$PWD/artifacts/archive-info-plist.txt"
          grep -F "$TANKTIME_ADMOB_APP_ID" "$PWD/artifacts/archive-info-plist.txt"
          grep -F "$TANKTIME_ADMOB_BANNER_ID" "$PWD/artifacts/archive-info-plist.txt"
          grep -F "$TANKTIME_ADMOB_INTERSTITIAL_ID" "$PWD/artifacts/archive-info-plist.txt"
          if grep -q '3940256099942544' "$PWD/artifacts/archive-info-plist.txt"; then
            echo 'ERROR: Google test identifier found in production archive' >&2
            exit 31
          fi
          if ! grep -q 'NSUserTrackingUsageDescription' "$PWD/artifacts/archive-info-plist.txt"; then
            echo 'ERROR: ATT usage description is missing from production archive' >&2
            exit 32
          fi
          ICON="$APP/AppIcon60x60@2x.png"
          if [[ -f "$ICON" ]]; then shasum -a 256 "$ICON" | tee "$PWD/artifacts/archive-icon-sha256.txt"; fi
          find "$PWD/artifacts/TankTime.xcarchive" -name PrivacyInfo.xcprivacy -print > "$PWD/artifacts/privacy-manifests.txt"
          while IFS= read -r manifest; do
            echo "===== $manifest =====" >> "$PWD/artifacts/privacy-manifests.txt"
            plutil -p "$manifest" >> "$PWD/artifacts/privacy-manifests.txt"
          done < <(find "$PWD/artifacts/TankTime.xcarchive" -name PrivacyInfo.xcprivacy -print)
      - name: Export IPA
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>signingStyle</key><string>manual</string>
          <key>teamID</key><string>${TEAM_ID}</string>
          <key>signingCertificate</key><string>Apple Distribution</string>
          <key>provisioningProfiles</key><dict>
          <key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
          </dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$PWD/artifacts/TankTime.xcarchive" \
            -exportPath "$PWD/artifacts/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          IPA=$(find "$PWD/artifacts/export" -name '*.ipa' -print -quit)
          test -n "$IPA"
          shasum -a 256 "$IPA" | tee "$PWD/artifacts/IPA_SHA256.txt"
      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ASC_KEY_ID" && test -n "$ASC_ISSUER_ID" && test -n "$ASC_API_KEY_BASE64"
          mkdir -p "$HOME/private_keys"
          KEY="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_API_KEY_BASE64" | base64 --decode > "$KEY"
          IPA=$(find "$PWD/artifacts/export" -name '*.ipa' -print -quit)
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TankTime-AppStore-IPA
          path: |
            artifacts/export/*.ipa
            artifacts/IPA_SHA256.txt
            artifacts/archive-info-plist.txt
            artifacts/archive-icon-sha256.txt
            artifacts/privacy-manifests.txt
          retention-days: 14
